services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localbi_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-localbi}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localbi_bootstrap} -d ${POSTGRES_DB:-localbi}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      localbi-network:
        aliases:
          - postgres
          - localbi-postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      localbi-network:
        aliases:
          - redis
          - localbi-redis

networks:
  localbi-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
